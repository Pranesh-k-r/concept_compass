{% extends 'base.html' %}

{% block content %}
<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<div class="graph-container">
    <a href="{% url 'progress:history' %}" class="btn btn-small">← Back to History</a>
    
    <div class="card mt-4">
        <h2>Interactive Concept Map</h2>
        <p>This map shows how foundational concepts lead to advanced topics. Scroll to zoom, and click/drag to explore.</p>
        
        <div id="mynetwork" style="width: 100%; height: 500px; border: 1px solid #e2e8f0; border-radius: 0.5rem; background: #f8fafc; margin-top: 1rem; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.05);"></div>
        
        <div class="table-responsive my-4" style="display:none;" id="fallback-table">
            <table style="width:100%; text-align:left; border-collapse: collapse;">
                <thead>
                    <tr style="border-bottom: 2px solid var(--border);">
                        <th style="padding:0.5rem;">Prerequisite Concept</th>
                        <th style="padding:0.5rem;">→</th>
                        <th style="padding:0.5rem;">Target Concept</th>
                    </tr>
                </thead>
                <tbody id="graph-body">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const nodesData = JSON.parse('{{ nodes_json|safe }}');
    const edgesData = JSON.parse('{{ edges_json|safe }}');
    
    // Vis.js Graph Rendering
    const container = document.getElementById('mynetwork');
    
    // Format nodes
    const visNodes = new vis.DataSet(
        nodesData.map(n => ({
            id: n.id,
            label: n.label,
            color: {
                background: n.color ? n.color.background : '#ffffff',
                border: n.color ? n.color.border : '#4f46e5',
                highlight: { background: '#e0e7ff', border: '#4338ca' }
            },
            font: { color: '#0f172a', face: 'Inter', size: 14 },
            shape: 'box',
            borderWidth: 2,
            borderRadius: 8,
            margin: 10
        }))
    );
    
    // Format edges
    const visEdges = new vis.DataSet(
        edgesData.map(e => ({
            from: e.from,
            to: e.to,
            arrows: 'to',
            color: { color: '#94a3b8', highlight: '#4f46e5' },
            smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.4 }
        }))
    );
    
    const data = { nodes: visNodes, edges: visEdges };
    const options = {
        layout: {
            hierarchical: {
                direction: 'UD', // Up-Down
                sortMethod: 'directed',
                nodeSpacing: 150,
                levelSeparation: 100
            }
        },
        physics: false,
        interaction: { hover: true }
    };
    
    const network = new vis.Network(container, data, options);
    
    const nodeMap = {};
    nodesData.forEach(n => nodeMap[n.id] = n);
    
    // Concept Details Panel (Modal)
    network.on("click", function (params) {
        if (params.nodes.length > 0) {
            const nodeId = params.nodes[0];
            const nodeData = nodeMap[nodeId];
            
            document.getElementById('modal-concept-name').innerText = nodeData.label;
            
            if (nodeData.metrics) {
                document.getElementById('modal-metrics').innerHTML = `
                    <div style="margin-bottom: 1rem;">
                        <span class="badge" style="background:var(--primary); color:white;">${nodeData.metrics.status}</span>
                        <p style="margin-top:0.5rem;"><strong>Accuracy:</strong> ${nodeData.metrics.accuracy}% (${nodeData.metrics.correct} correct / ${nodeData.metrics.attempted} attempted)</p>
                        <p><strong>Reason:</strong> ${nodeData.metrics.reason}</p>
                    </div>
                `;
            }
            
            document.getElementById('modal-lesson-link').href = '/learning/lesson/' + nodeId + '/';
            document.getElementById('modal-practice-link').href = '/learning/practice/' + nodeId + '/';
            
            document.getElementById('concept-modal').style.display = 'flex';
        }
    });
    
    function closeModal() {
        document.getElementById('concept-modal').style.display = 'none';
    }
    
    // Fallback Table generation for accessibility (hidden by default)
    const tbody = document.getElementById('graph-body');
    edgesData.forEach(e => {
        if(nodeMap[e.from] && nodeMap[e.to]) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td style="padding:0.5rem;">${nodeMap[e.from].label}</td>
                            <td style="padding:0.5rem;">→</td>
                            <td style="padding:0.5rem;">${nodeMap[e.to].label}</td>`;
            tbody.appendChild(tr);
        }
    });
</script>

<!-- Concept Details Modal -->
<div id="concept-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:var(--surface); padding:2rem; border-radius:1rem; max-width:400px; width:90%; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);">
        <h3 id="modal-concept-name" class="text-primary mb-3">Concept Name</h3>
        <div id="modal-metrics"></div>
        <div style="display:flex; flex-direction:column; gap:1rem;">
            <a id="modal-lesson-link" href="#" class="btn btn-primary" style="text-align:center;">📖 View Lesson</a>
            <a id="modal-practice-link" href="#" class="btn btn-secondary" style="text-align:center;">✏️ Start Practice</a>
            <button onclick="closeModal()" class="btn btn-small" style="margin-top:1rem; background:transparent; color:var(--text-light); border:1px solid var(--border);">Close</button>
        </div>
    </div>
</div>

{% endblock %}
